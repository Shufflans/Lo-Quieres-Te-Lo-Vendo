<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Lo Quieres, Te lo Vendo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-dark bg-primary py-2">
            <div class="container d-flex justify-content-between align-items-center">
                <a class="navbar-brand fw-bold mb-0" href="index.html">Lo Quieres, Te lo Vendo</a>
                <div class="navbar-nav flex-row gap-3">
                    <a class="nav-link text-white" href="index.html">Inicio</a>
                    <a class="nav-link text-white" href="contacto.html">Contacto</a>
                    <a class="nav-link text-white" href="#productos">Productos</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h2 class="text-center mb-4 fw-bold">Contáctanos</h2>
                    
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label font-weight-bold">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre completo">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="ejemplo@correo.com">
                        </div>

                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-primary text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">Desarrollado por: Nicolas Chauca - Camilo Covarrubias - Gabriel Yañez - Año 2026</p>
        </div>
    </footer>
</body>
</html>
